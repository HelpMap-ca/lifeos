<style>

  main.view { flex:1; overflow:auto; }

<script>
"use strict";
/* Opened by double-click? A file:// page can't reach the local AI, the /api
   spine, or (in some browsers) storage — it boots into a dead blank page.
   Bounce to the served copy when the server is up; explain when it isn't. */
if(location.protocol==='file:'){
  (async()=>{ const U='http://localhost:8765/lifeos.html';
    try{ await fetch(U,{mode:'no-cors',cache:'no-store'}); location.replace(U); }
    catch(e){ document.documentElement.innerHTML=
      '<body style="margin:0;display:grid;place-items:center;height:100vh;background:#f6f6f4;font-family:system-ui,sans-serif"><div style="max-width:500px;padding:40px;text-align:center"><div style="width:56px;height:56px;border-radius:14px;background:#E31E24;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;margin:0 auto 18px">M</div><h2 style="margin:0 0 8px">Don&#39;t open me from the folder</h2><p style="color:#52525b;line-height:1.6;margin:0">A double-clicked file can&#39;t reach your local AI or your data spine, so LifeOS looks dead. Double-click <b>M.command</b> on the Desktop instead — it starts everything and opens the real thing at <a href="'+U+'" style="color:#1d4ed8">localhost:8765</a> (map.ca front door at <a href="http://localhost:3001/" style="color:#1d4ed8">localhost:3001</a>).</p></div></body>'; }
  })();
  throw new Error('file:// detected — bouncing to the served copy');
}
/* Embedded mode: when LifeOS runs inside the layer's iframe over the real
   map.ca (localhost:3001), the iframe IS the glass window — drop our own
   ground + chrome so it isn't glass-inside-glass. */
if(window!==window.top) document.documentElement.classList.add('embedded');
/* ============================================================
   M · LifeOS — single shared data core. On-device.
   Universal Taxonomy Record (§2) is the row shape for EVERYTHING.
   Every view reads/writes CORE — no isolated stores.
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const LS={ get:(k,d)=>{try{const v=localStorage.getItem('mos.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set:(k,v)=>localStorage.setItem('mos.'+k,JSON.stringify(v)), del:k=>localStorage.removeItem('mos.'+k) };
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
const todayISO=()=>new Date().toISOString().slice(0,10);
const nowISO=()=>new Date().toISOString();
function fmtMoney(n){ if(n==null||n==='')return ''; const x=Number(n); if(isNaN(x))return ''; return '$'+x.toLocaleString(undefined,{maximumFractionDigits:0}); }

/* ---------- taxonomy (data, not hard-coded UI) ---------- */
const WORKSPACES=[
  {id:'all',label:'All workspaces'},
  {id:'personal',label:'Personal'},
  {id:'family',label:'Family & Household'},
  {id:'properties',label:'Properties'},
  {id:'andcandid',label:'And Can Did Inc.'},
  {id:'mapca',label:'Map.ca'},
  {id:'foundation',label:'Map Foundation'},
  {id:'mspc',label:'Professional Corp.'},
  {id:'brokerage',label:'Mapca Realty Brokerage'},
  {id:'recycling',label:'Recycling · Repair · Resale'},
];
const STATUS=['Draft','Proposed','Pending','Approved','Active','Waiting','Blocked','At risk','Under review','Completed','Rejected','Cancelled','Expired','Archived'];
const PRIORITY=['P0','P1','P2','P3','P4','P5'];
const VERIFY=['Unverified','Partially verified','Verified','Professionally verified','Disputed','Outdated','Expired','Superseded'];
const CONFIDENCE=['Unknown','Low','Moderate','High','Confirmed by source','Confirmed by human','Confirmed by professional'];
const AUTOMATION=['A0 record only','A1 suggest','A2 draft','A3 request approval','A4 low-risk auto','A5 recurring auto','A6 escalate'];
const CONFIDENTIAL=['Public','Community','Business internal','Team restricted','Family','Personal','Confidential','Financial restricted','Legal restricted','Health restricted'];

/* object types grouped (§3) — used to populate the type picker */
const OBJECT_GROUPS={
  'People & orgs':['Person','Family member','Friend','Contact','Client','Lead','Contractor','Employee','Advisor','Partner','Vendor','Supplier','Emergency contact','Organization','Corporation','Government body','Municipality','School','Community group'],
  'Work & planning':['Goal','Objective','Project','Program','Milestone','Task','Subtask','Commitment','Deliverable','Decision','Approval','Request','Issue','Opportunity','Risk','Experiment','SOP','Checklist','Template'],
  'Time':['Event','Appointment','Meeting','Deadline','Reminder','Birthday','Anniversary','Renewal','Routine','Habit','Review'],
  'Financial':['Financial account','Transaction','Expense','Revenue','Invoice','Bill','Receipt','Budget','Subscription','Donation','Grant','Tax obligation','Tax payment','Asset value','Liability','Forecast'],
  'Legal & compliance':['Legal entity','Registration','Licence','Permit','Contract','Agreement','Lease','Policy','Filing','Claim','Dispute','Compliance requirement','Intellectual property','Trademark','Domain registration'],
  'Property & assets':['Property','Building','Land parcel','Room','System','Vehicle','Trailer','Equipment','Tool','Device','Inventory item','Pet','Warranty','Maintenance record','Inspection','Repair','Improvement'],
  'Knowledge & comms':['Note','Idea','Observation','Message','Email','Call','Meeting transcript','Document','File','Research source','Article','Course','Credential','Prompt','AI response','Knowledge claim'],
  'Technology':['Application','Website','Domain','Repository','Database','Server','Model','AI agent','API','Integration','Automation','Credential','Backup','Deployment','Feature','Bug','Evaluation','Dataset'],
};
const ALL_TYPES=Object.values(OBJECT_GROUPS).flat();

/* relationship types (§5) — light support */
const REL_TYPES=['Parent of','Child of','Spouse of','Works with','Reports to','Client of','Vendor for','Owns','Operated by','Program of','Belongs to project','Depends on','Blocks','Paid by','Paid to','Located at','Part of','Documented by','Verified by','Related to'];

/* ---------- the shared CORE ----------
   Records live in the vault (vault/records.json) and are cached here in
   localStorage. Storage alone used to be the ONLY copy: clearing site data
   took every person, project and property with it, and no backup covered
   them because nothing was ever written to disk.

   The cache is kept deliberately. Offline-first is the product, so the
   dashboard must still open and still save when the local server is not
   running — the browser copy is what makes that true. The vault copy is
   what makes it survive. */
let CORE = LS.get('core', null);
let CORE_DIRTY = false;      // unsaved changes the vault has not accepted yet
let CORE_SAVE_TIMER = null;

/* Persist to the vault, coalescing bursts. A single edit can fire several
   saveCore() calls; writing the file on each one would be wasteful without
   being any safer, since the browser copy is already current. */
function saveCoreToVault(){
  CORE_SAVE_TIMER = null;
  const body = JSON.stringify({ seq: CORE.seq || 0, records: CORE.records || {} });
  /* keepalive: the beforeunload flush reuses this function, and a plain
     fetch fired during document teardown is routinely cancelled — the
     flag lets the request outlive the page. */
  fetch('/api/records', { method:'POST', headers:{'Content-Type':'application/json'}, body, keepalive:true })
    .then(r => r.json())
    .then(j => { CORE_DIRTY = !j.ok; if(!j.ok) console.error('records save refused:', j.error); })
    .catch(e => { CORE_DIRTY = true; console.error('records save failed (kept in this browser):', e); });
}

function saveCore(){
  LS.set('core', CORE);            // immediate, and what the UI reads back
  CORE_DIRTY = true;
  if(CORE_SAVE_TIMER) clearTimeout(CORE_SAVE_TIMER);
  CORE_SAVE_TIMER = setTimeout(saveCoreToVault, 600);
}

/* A close with a pending write would lose that last edit from the vault
   copy — the browser still has it, but the point of this is that the
   browser is not the only copy. */
window.addEventListener('beforeunload', () => {
  if(CORE_SAVE_TIMER){ clearTimeout(CORE_SAVE_TIMER); saveCoreToVault(); }
});
function uid(){ CORE.seq=(CORE.seq||0)+1; return 'tx-'+CORE.seq.toString(36)+'-'+Math.floor(Math.random()*1e4).toString(36); }
function newRecord(p={}){
  const t=nowISO();
  return Object.assign({
    taxonomy_id:uid(), parent_id:'', workspace_id:CTX.ws==='all'?'personal':CTX.ws, domain_id:'', agent_id:'',
    label:'', description:'', object_type:'Task', owner:'Owner', participants:'', status:'Active',
    priority:'P3', confidentiality:'Business internal', source:'manual', source_date:'', effective_date:'',
    due_date:'', review_date:'', location:'', related_records:[], dependencies:'', financial_value:'',
    risk_level:'', confidence_level:'Moderate', verification_status:'Unverified', automation_level:'A1 suggest',
    retention_rule:'', created_at:t, updated_at:t, version:1, audit_history:[{at:t,act:'created'}]
  }, p);
}
function upsert(rec){ rec.updated_at=nowISO(); if(!CORE.records[rec.taxonomy_id]) CORE.records[rec.taxonomy_id]=rec; else CORE.records[rec.taxonomy_id]=rec; saveCore(); }
function del(id){ delete CORE.records[id]; saveCore(); }
function all(){ return Object.values(CORE.records); }
function query({ws,types,search}={}){
  let r=all();
  if(ws&&ws!=='all') r=r.filter(x=>x.workspace_id===ws);
  if(types&&types.length) r=r.filter(x=>types.includes(x.object_type));
  if(search){ const q=search.toLowerCase(); r=r.filter(x=>(x.label+' '+x.description+' '+x.object_type+' '+x.owner).toLowerCase().includes(q)); }
  return r.sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''));
}

/* ---------- seed on first run ---------- */
function seed(){
  CORE={seq:0,records:{}};
  const mk=(p)=>{const r=newRecord(p); CORE.records[r.taxonomy_id]=r;};
  // entities / business
  mk({object_type:'Corporation',label:'And Can Did Inc.',workspace_id:'andcandid',domain_id:'Governance',status:'Active',verification_status:'Verified',confidence_level:'Confirmed by human',description:'Parent operating company.'});
  mk({object_type:'Corporation',label:'Sample Professional Corporation',workspace_id:'mspc',status:'Active'});
  mk({object_type:'Organization',label:'Map.ca',workspace_id:'mapca',status:'Active',description:'Community mapping platform + vertical ecosystem.'});
  mk({object_type:'Organization',label:'Map Foundation initiative',workspace_id:'foundation',status:'Active',description:'Public-benefit arm · 90/10 policy.'});
  mk({object_type:'Organization',label:'Mapca Realty (brokerage)',workspace_id:'brokerage',status:'Active',description:'RECO/TRESA regulated brokerage.'});
  // domains
  mk({object_type:'Domain',label:'map.ca',workspace_id:'mapca',status:'Active',description:'Core homebase domain.',verification_status:'Verified'});
  mk({object_type:'Domain',label:'askmap.ca',workspace_id:'mapca',status:'Active',description:'Public ledger vertical. Bought 2026-07-28.',source_date:'2026-07-28'});
  // properties
  mk({object_type:'Property',label:'123 Sample Road',workspace_id:'properties',status:'Active',description:'Farm + workshop property.',financial_value:''});
  mk({object_type:'Property',label:'456 Sample Highway',workspace_id:'properties',status:'Active',description:'Property.'});
  // tech
  mk({object_type:'Server',label:'Local AI server (example)',workspace_id:'andcandid',domain_id:'Technology',status:'Draft',location:'',description:'Optional GPU box serving an OpenAI-compatible endpoint.'});
  // people
  mk({object_type:'Person',label:'You',workspace_id:'personal',status:'Active',confidentiality:'Personal',description:'The person this LifeOS belongs to.'});
  // sample work
  mk({object_type:'Task',label:'Set up my first project',workspace_id:'personal',domain_id:'',status:'Active',priority:'P2',due_date:'',description:'Sample task — replace with your own.'});
  mk({object_type:'Project',label:'AskMap.ca public ledger',workspace_id:'mapca',status:'Active',priority:'P2',description:'Ask → explainer → agree loop, backed by DGX qwen3-32b.'});
  mk({object_type:'Renewal',label:'Domain renewal review',workspace_id:'andcandid',domain_id:'Brand',status:'Active',priority:'P3',review_date:''});
  saveCore();
}
/* ---------- context (must exist before seed(), which calls newRecord→CTX) ---------- */
const CTX={ ws: LS.get('ws','all'), view: 'grid' };
if(!CORE){ seed(); }

/* Adopt the vault copy once the page is up.

   The browser copy renders first so nothing waits on the server — but the
   vault is the durable one, so if it holds records they win. Three cases:

     · vault has records  -> use them (this is the normal path, and the one
       that makes a cleared browser recoverable rather than fatal)
     · vault is empty and the browser has a real core -> push it up once.
       This is the migration for anyone who used LifeOS before records were
       written to disk; it happens silently, exactly once.
     · server unreachable -> carry on with the browser copy. Offline is a
       supported state, not an error. */
(async function adoptVaultRecords(){
  let vault;
  try{
    vault = await (await fetch('/api/records', {cache:'no-store'})).json();
  }catch(e){
    console.info('records: vault unreachable, using the copy in this browser'); return;
  }
  if(!vault || !vault.ok) return;
  const vaultCount = vault.count || 0;
  const localCount = Object.keys((CORE && CORE.records) || {}).length;

  if(vaultCount > 0){
    /* Adopting authoritative vault state: a pending debounced save from
       an edit made in the ~600ms before this response would fire AFTER
       the adopt and push the adopted core back up, losing that edit from
       both copies — cancel it and clear the dirty flag first. */
    if(CORE_SAVE_TIMER){ clearTimeout(CORE_SAVE_TIMER); CORE_SAVE_TIMER = null; }
    CORE_DIRTY = false;
    CORE = { seq: vault.seq || 0, records: vault.records };
    LS.set('core', CORE);
    if(vault.recovered_from_backup)
      console.warn('records: the vault file was damaged and was restored from its backup.');
    if(typeof render === 'function') render();
    return;
  }
  if(localCount > 0){
    console.info('records: first save of this browser copy into the vault (%d).', localCount);
    /* Direct call (no debounce) is deliberate: the vault is empty, so
       this cannot clobber anything, and a first-render user edit that
       races it just re-arms the debounce over the same CORE object. */
    saveCoreToVault();
  }
})();

/* ============================================================
   SETTINGS + AI providers (DGX default, frontier labelled)
   ============================================================ */
const DEF={ dgxBase:'http://localhost:11434/v1', dgxToken:'', dgxModel:'qwen2.5:32b', dgxModel2:'llama3.1:8b', dgxVision:'qwen2.5vl:7b', dgxEmbed:'nomic-embed-text', anthropic:'', gemini:'', ccRoute:false, ccBridge:'http://localhost:8787' };
let CFG=Object.assign({},DEF,LS.get('cfg',{}));
if(!CFG.dgxVision) CFG.dgxVision=DEF.dgxVision; /* older saved cfg had '' here */
function saveCfg(){ LS.set('cfg',CFG); }
const FRONTIER=[
  {id:'claude-opus-4-8',label:'Opus 4.8',badge:'Opus',provider:'claude'},
  {id:'claude-fable-5',label:'Fable 5',badge:'Fable',provider:'claude'},
  {id:'claude-sonnet-5',label:'Sonnet 5',badge:'Sonnet',provider:'claude'},
  {id:'gemini-2.5-pro',label:'Gemini 2.5 Pro',badge:'Gemini',provider:'gemini'},
  {id:'gemini-2.5-flash',label:'Gemini 2.5 Flash',badge:'Gemini',provider:'gemini'},
];
function providerFor(id){ const f=FRONTIER.find(m=>m.id===id); return f?f.provider:'dgx'; }
/* Every model actually pulled on this Mac, straight from Ollama. The two
   Settings fields (daily/fast) stay the defaults, but anything you pull is
   testable in Chat and Arena without editing settings first — otherwise a new
   model is installed and invisible, which is exactly how Gemma 4 went missing. */
let LOCAL_MODELS=[];
async function loadLocalModels(){
  try{
    const base=(CFG.dgxBase||'').replace(/\/v1\/?$/,'').replace(/\/$/,'');
    const r=await fetch(base+'/api/tags',{cache:'no-store'});
    if(!r.ok) return LOCAL_MODELS;
    const j=await r.json();
    LOCAL_MODELS=(j.models||[]).map(m=>m.name).filter(Boolean).sort();
  }catch(e){}
  return LOCAL_MODELS;
}
/* Settings' daily/fast first, then everything else that is installed. */
function localModelOptions(){
  const seen=new Set(), out=[];
  [[CFG.dgxModel,' · daily'],[CFG.dgxModel2,' · fast']].forEach(([id,sfx])=>{
    if(id&&!seen.has(id)){ seen.add(id); out.push([id,id+sfx]); } });
  LOCAL_MODELS.forEach(id=>{ if(!seen.has(id)){ seen.add(id); out.push([id,id]); } });
  return out;
}
async function* sseText(res,pick){
  const rd=res.body.getReader(),dec=new TextDecoder(); let buf='';
  while(true){ const {done,value}=await rd.read(); if(done)break; buf+=dec.decode(value,{stream:true}); let i;
    while((i=buf.indexOf('\n'))>=0){ let line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
      if(!line.startsWith('data:'))continue; const d=line.slice(5).trim(); if(d==='[DONE]')return;
      try{ const t=pick(JSON.parse(d)); if(t)yield t; }catch(e){} } }
}
async function* streamDGX(messages,model,signal){
  const _local=/localhost|127\.0\.0\.1/.test(CFG.dgxBase);
  if(!_local && !CFG.dgxToken) throw new Error('No token set for '+CFG.dgxBase+' (Settings).');
  const res=await fetch(CFG.dgxBase.replace(/\/$/,'')+'/chat/completions',{method:'POST',signal,
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.dgxToken},
    body:JSON.stringify({model,messages,stream:true,temperature:0.7})});
  if(!res.ok) throw new Error('DGX '+res.status+': '+(await res.text()).slice(0,160));
  yield* sseText(res,o=>o?.choices?.[0]?.delta?.content||'');
}
async function* streamClaude(messages,model,signal){
  if(!CFG.anthropic) throw new Error('No Anthropic key (Settings).');
  const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n')||undefined;
  const msgs=messages.filter(m=>m.role!=='system').map(m=>({role:m.role,content:m.content}));
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,
    headers:{'Content-Type':'application/json','x-api-key':CFG.anthropic,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model,max_tokens:1400,system:sys,messages:msgs,stream:true})});
  if(!res.ok) throw new Error('Claude '+res.status+': '+(await res.text()).slice(0,160));
  yield* sseText(res,o=>(o?.type==='content_block_delta'&&o.delta?.type==='text_delta')?o.delta.text:'');
}
async function* streamGemini(messages,model,signal){
  if(!CFG.gemini) throw new Error('No Gemini key (Settings).');
  const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n');
  const contents=messages.filter(m=>m.role!=='system').map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
  const body={contents}; if(sys)body.systemInstruction={parts:[{text:sys}]};
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(CFG.gemini)}`,
    {method:'POST',signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok) throw new Error('Gemini '+res.status+': '+(await res.text()).slice(0,160));
  yield* sseText(res,o=>o?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'');
}
async function* streamCC(messages,model,signal){
  const res=await fetch((CFG.ccBridge||'http://localhost:8787').replace(/\/$/,'')+'/v1/chat',{method:'POST',signal,
    headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,model})});
  if(!res.ok) throw new Error('Bridge '+res.status+': '+(await res.text()).slice(0,140));
  yield* sseText(res,o=>o.text||'');
}
async function* streamAny(messages,id,signal){
  const p=providerFor(id);
  if(p==='claude'){ if(CFG.ccRoute) yield* streamCC(messages,id,signal); else yield* streamClaude(messages,id,signal); }
  else if(p==='gemini') yield* streamGemini(messages,id,signal);
  else yield* streamDGX(messages,id,signal);
}

/* ---------- the ground layer: the map IS the page ---------- */
async function drawGround(){
  const g=$('#bgLayer'); if(!g) return;
  const src=LS.get('mmsrc','scene');
  if(MM.ground){ try{MM.ground.remove();}catch(e){} MM.ground=null; }
  if(src==='scene'){
    const hr=new Date().getHours();
    const tint=hr<6?'rgba(10,15,40,.45)':hr<9?'rgba(255,170,80,.16)':hr<17?'rgba(0,0,0,0)':hr<21?'rgba(255,120,60,.20)':'rgba(10,15,40,.45)';
    g.innerHTML='<div class="scene"><div class="scene-tint" style="background:'+tint+'"></div><img class="balloon" src="assets/balloons/canada.webp" alt=""></div>';
    g.style.background='var(--paper)'; wxLoad(); return;
  }
  if(src==='image'){
    const b=LS.get('bg',null);
    g.innerHTML=''; g.style.background=b?('center / cover no-repeat url('+b+') fixed'):'var(--paper)';
    if(!b) toast('No background uploaded yet — press 🖼 to add one');
    return;
  }
  g.style.background='var(--paper)';
  if(src==='dev'||src==='live'||src==='prod'){
    const u=src==='dev'?'http://localhost:3000/':(src==='prod'?'http://localhost:3001/':'https://map.ca/');
    g.innerHTML='<iframe src="'+u+'"></iframe>';
    return;
  }
  g.innerHTML='<div id="groundMap" style="position:absolute;inset:0"></div>';
  const ok=await mmLeaflet(); if(!ok||!window.L||!$('#groundMap')) return;
  if(!MM.pins){ try{ MM.pins=await (await fetch('/api/pins',{cache:'no-store'})).json(); }catch(e){} }
  const located=mmPins().filter(p=>p.lat!=null&&p.lng!=null);
  const m=L.map($('#groundMap'),{zoomControl:false,attributionControl:navigator.onLine}).setView([44.57,-80.94],located.length?9:5);
  MM.ground=m;
  if(navigator.onLine) L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
  located.forEach(p=>L.circleMarker([p.lat,p.lng],{radius:7,color:'#e31e24',weight:2,fillColor:'#e31e24',fillOpacity:.35})
    .bindPopup('<b>'+p.title+'</b><br>'+(p.category||'')+(p.origin==='local'?' · local':'')).addTo(m));
  if(located.length) m.fitBounds(L.latLngBounds(located.map(p=>[p.lat,p.lng])).pad(0.3));
  m.on('click',async e=>{ if(!MM.addMode) return;
    const title=prompt('Pin title'); if(!title) return;
    try{ const r=await(await fetch('/api/pins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title,lat:e.latlng.lat,lng:e.latlng.lng,category:'personal'})})).json();
      if(r.ok){ toast('Pin dropped — saved to the spine'); MM.addMode=false;
        MM.pins=await(await fetch('/api/pins',{cache:'no-store'})).json(); drawGround(); if(CTX.view==='mymap') mmDrawProfile(); }
      else toast(r.error||'could not save pin');
    }catch(err){ toast('could not save pin'); } });
}

async function vaultDocs(){ if(Array.isArray(window._docs)) return window._docs;
  try{ const j=await(await fetch('/api/docs',{cache:'no-store'})).json(); window._docs=Array.isArray(j.docs)?j.docs:[]; }
  catch(e){ window._docs=[]; }

/* ================= HOUSE DNA — property profile + document intake =========
   The first LifeOS micro-tool. Photograph a tax bill, the Mac's own Vision
   OCR reads it, a local model turns it into fields, and they land in the
   record. No cloud, no API key, no upload of your paperwork to anyone.      */
const PROPERTY_TYPES=['Property','Real estate','Land','Building','Asset','Vehicle','Equipment'];
let DNA_SCHEMA=null;
async function dnaSchema(){
  if(DNA_SCHEMA) return DNA_SCHEMA;
  try{ const r=await fetch('./house-dna.json',{cache:'no-store'}); if(r.ok) DNA_SCHEMA=await r.json(); }
  catch(e){}
  return DNA_SCHEMA;
}
function dnaOf(rec){ return (rec.house_dna&&typeof rec.house_dna==='object')?rec.house_dna:{}; }

async function renderHouseDNA(host,rec){
  const s=await dnaSchema();
  if(!s){ host.innerHTML='<div class="note mono" style="font-size:11px">House DNA schema unavailable — serve LifeOS from the MapAi app, not file://.</div>'; return; }
  const dna=dnaOf(rec);
  const filled=Object.values(dna).filter(v=>v!==''&&v!=null).length;
  const total=s.groups.reduce((n,g)=>n+g.fields.length,0);
  host.innerHTML=`
    <div style="border-top:1px solid var(--line);margin-top:18px;padding-top:16px">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px">
        <h4 style="font-size:14px;margin:0">🧬 House DNA</h4>
        <span class="mono" style="font-size:11px;color:var(--ink-4)">${filled} of ${total} fields</span>
      </div>
      <p style="font-size:12px;color:var(--ink-3);margin:0 0 12px">Everything this property is, in one place. Drop a document below and your own machine fills these in.</p>

      <div id="dnaDrop" style="border:1.5px dashed var(--line);border-radius:11px;padding:18px;text-align:center;cursor:pointer;transition:.15s">
        <div style="font-size:22px;line-height:1">📄</div>
        <div style="font-size:13px;font-weight:600;margin-top:4px">Upload a tax bill, assessment, policy or invoice</div>
        <div style="font-size:11.5px;color:var(--ink-4);margin-top:3px">Photo, screenshot or PDF · drag here or click · never leaves this Mac</div>
        <input type="file" id="dnaFile" accept="image/*,.pdf" style="display:none">
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap">
        <select id="dnaModel" style="max-width:190px">
          <option value="llama3.1:8b">Fast · llama3.1:8b (~4s)</option>
          <option value="qwen2.5:32b" selected>Thorough · qwen2.5:32b (~13s)</option>
        </select>
        <span class="mono" id="dnaMsg" style="font-size:11px;color:var(--ink-4)"></span>
      </div>
      <div id="dnaResult" style="margin-top:12px"></div>
      <div id="dnaFields" style="margin-top:14px"></div>
    </div>`;

  drawDnaFields(rec);

  const drop=$('#dnaDrop'), inp=$('#dnaFile'), msg=$('#dnaMsg');
  drop.onclick=()=>inp.click();
  drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='var(--accent,#0b6b5f)';};
  drop.ondragleave=()=>{drop.style.borderColor='var(--line)';};
  drop.ondrop=e=>{e.preventDefault();drop.style.borderColor='var(--line)';
    if(e.dataTransfer.files[0]) handleDoc(e.dataTransfer.files[0],rec);};
  inp.onchange=()=>{ if(inp.files[0]) handleDoc(inp.files[0],rec); };
}

function drawDnaFields(rec){
  const host=$('#dnaFields'); if(!host||!DNA_SCHEMA) return;
  const dna=dnaOf(rec);
  host.innerHTML=DNA_SCHEMA.groups.map(g=>{
    const rows=g.fields.map(f=>{
      const v=dna[f.k]==null?'':dna[f.k];
      const tag=f.type==='textarea'
        ? `<textarea id="dna_${f.k}" rows="2" data-dna="${f.k}">${esc(String(v))}</textarea>`
        : `<input id="dna_${f.k}" data-dna="${f.k}" value="${esc(String(v))}" ${f.type==='date'?'type="date"':''} placeholder="${esc(f.hint||'')}">`;
      return `<label class="fld"><span>${esc(f.label)}</span>${tag}</label>`;
    }).join('');
    const n=g.fields.filter(f=>dna[f.k]!=null&&dna[f.k]!=='').length;
    return `<details class="more" ${n?'open':''}><summary>${g.icon} ${g.label} <span class="mono" style="font-size:10.5px;color:var(--ink-4)">${n}/${g.fields.length}</span></summary>
      <div class="fgrid">${rows}</div></details>`;
  }).join('');
  host.oninput=e=>{
    const k=e.target.dataset&&e.target.dataset.dna; if(!k) return;
    const r=window._edit; if(!r) return;
    r.house_dna=r.house_dna||{}; r.house_dna[k]=e.target.value;
  };
}

async function handleDoc(file,rec){
  const msg=$('#dnaMsg'), res=$('#dnaResult');
  if(file.size>8*1024*1024){ msg.textContent='over 8 MB'; return; }
  const model=$('#dnaModel').value;
  msg.textContent='reading…';
  res.innerHTML=`<div class="note mono" style="font-size:11.5px">📷 Apple Vision is reading the page, then ${esc(model)} turns it into fields. All on this Mac.</div>`;
  const t0=Date.now();
  const rd=new FileReader();
  rd.onload=async()=>{
    let r;
    try{
      r=await fetch('/api/doc/extract',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({image_base64:rd.result,model:model,property:rec.label||''})}).then(x=>x.json());
    }catch(e){ msg.textContent='local server not reachable'; res.innerHTML=''; return; }
    if(!r.ok){ msg.textContent=''; res.innerHTML=`<div class="note mono" style="font-size:11.5px;color:var(--red,#c0392b)">${esc(r.error||'extraction failed')}</div>`; return; }
    msg.textContent=`${((Date.now()-t0)/1000).toFixed(1)}s`;

    const f=r.fields||{}; const keys=Object.keys(f);
    const mark={verified:'<span style="color:var(--good,#0b6b5f)">✓</span>',
                repaired:'<span style="color:#2a7fb8">↻</span>',
                unverified:'<span style="color:var(--warn,#8a5a00)">?</span>'};
    res.innerHTML=`<div class="card" style="padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
        <b style="font-size:13px">${esc(r.doc_type_label||'Document')}</b>
        <span class="mono" style="font-size:10.5px;color:var(--ink-4)">
          Vision ${r.ocr.ms}ms · ${esc(r.llm.model)} ${r.llm.ms}ms · ${r.ocr.lines} lines</span>
      </div>
      ${keys.length?`<table class="tbl" style="margin-top:8px"><tbody>${keys.map(k=>
        `<tr><td style="width:22px">${mark[f[k].state]||''}</td>
             <td class="mono" style="font-size:11px">${esc(k)}</td>
             <td style="font-size:12px">${esc(String(f[k].value)).slice(0,120)}</td></tr>`).join('')}</tbody></table>`
        :'<p style="font-size:12px;color:var(--ink-4);margin:8px 0 0">Nothing extractable found.</p>'}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn sm" id="dnaApply">Apply ${keys.length} field${keys.length===1?'':'s'} to House DNA</button>
        <button class="btn ghost sm" id="dnaDismiss">Dismiss</button>
      </div>
      <p style="font-size:11px;color:var(--ink-4);margin:9px 0 0">✓ found verbatim in the document · ↻ repaired (OCR letter/digit fixes, number formatting) · ? not found verbatim — check it. Nothing is applied until you press the button.</p>
    </div>`;

/* Native tools: the page posts inputs to mapai-server, which runs a compiled

   download button — the saving and the list of what was stripped are the

async function runNative(a,v,raw,o){
  const imgKey=a.multi?'images':'image', src=raw[imgKey], picked=src&&src._data;
  if(!picked||(a.multi&&picked.length<2))
    throw new Error(a.multi?'choose at least two bracketed frames — press 📁 Choose'

  /* Everything except the image(s) is a tool argument. The server decides which
     of them are real flags and clamps the values, so the page can stay dumb. */
  const args={}; Object.keys(v).forEach(k=>{ if(k===imgKey)return;
    const el0=raw[k]; if(el0&&el0.dataset&&el0.dataset.def!==undefined&&String(v[k])===el0.dataset.def) return;
    if(v[k]!==''&&v[k]!==false) args[k]=v[k]; });
  const payload={tool:a.tool,name:src._name||'photo.jpg',args};
  if(a.multi) payload.images=picked; else payload.data=picked;
  const r=await fetch(a.native,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok||!j||!j.ok) throw new Error((j&&j.error)||('server said HTTP '+r.status));
  const d=j.report, kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';
  const row=(k,val)=>`<div class="kv"><span class="k">${k}</span><span class="v">${val}</span></div>`;
  let head='', rows='', foot='';
  if(a.tool==='mapshot'){
    head=`<div style="font-size:22px;font-weight:700;color:var(--good)">${d.savedPercent}% smaller</div>
      <div class="mono" style="font-size:12px;margin:4px 0 12px">${kb(d.bytesIn)} → ${kb(d.bytesOut)} · ${esc(d.sourcePixels)} → ${esc(d.outputPixels)}</div>`;
    rows=row('Budget',d.withinBudget?'within '+d.budgetKB+' KB ✓':'over '+d.budgetKB+' KB')
      +(d.capturedAt?row('Taken',esc(d.capturedAt)):'')
      +(d.headingCompass?row('Facing',esc(d.headingCompass)+' ('+Math.round(d.headingDegrees)+'°) — kept'):'')
      +(d.camera?row('Camera',esc(d.camera)):'')
      +row('GPS',d.gpsPresent?(d.gpsKept?'kept (you asked)':'removed'):'none in file');
    const strip=(d.stripped||[]).map(s=>`<li><b>${esc(s.tag)}</b> — ${esc(s.why)}</li>`).join('');
    foot=(strip?`<b>Removed ${d.strippedCount} identifying tag(s)</b> — this is what your photo was carrying:<ul style="margin:6px 0 0 18px">${strip}</ul>`
                :'<b>Nothing identifying was in this file.</b>')
        +(d.gpsNote?`<div style="margin-top:8px;color:var(--ink-3)">${esc(d.gpsNote)}</div>`:'');
  } else if(a.tool==='mapcolor'){
    const gr=d.grade||{};
    head=`<div style="font-size:19px;font-weight:700">Graded</div>
      <div class="mono" style="font-size:12px;margin:4px 0 12px">${esc(d.pixels)} · ${kb(d.bytesOut)}</div>`;
    rows=row('White balance',`R×${gr.gainR} G×${gr.gainG} B×${gr.gainB}${d.auto?' · measured':''}`)
      +row('Exposure',gr.exposure+' EV')+row('Temp / tint',gr.temp+' / '+gr.tint)
      +row('Saturation',gr.saturation)+row('Vibrance',gr.vibrance)
      +row('Shadows / highlights',gr.shadows+' / '+gr.highlights);
    foot=`<b>Reuse these numbers.</b> The same grade applied to every photo of a property is what makes a listing look like one listing. Capture time and compass heading are carried through, so this can still go through <b>Map-ready photo</b> afterwards.`;
  } else if(a.tool==='maphdr'){
    const rej=(d.shifts||[]).filter(s=>/rejected/.test(s)).length;
    head=`<div style="font-size:19px;font-weight:700">${d.frames} frames fused</div>
      <div class="mono" style="font-size:12px;margin:4px 0 12px">${esc(d.pixels)} · ${kb(d.bytesOut)}</div>`;
    rows=row('Aligned',d.aligned+' of '+(d.frames-1)+' shifted'+(rej?' · '+rej+' rejected as implausible':''))
      +row('Strength',d.strength)+row('Smoothing',d.smooth+'px')
      +row('Shadows / highlights',d.shadows+' / '+d.highlights);
    foot=`<b>Exposure fusion, not tone-mapped HDR.</b> It picks which frame looked best at each pixel and blends — there is no tone curve to overdo, which is why it reads as a photograph. Pull <b>strength</b> toward 0 to fall back to your middle exposure. A shift reported as <i>rejected</i> means the matcher lost its footing on a washed-out frame; that frame was left where it was, which is the safe outcome.`;
  } else if(a.tool==='mapmatte'){
    head=`<div style="font-size:19px;font-weight:700">${d.instancesUsed} of ${d.instancesFound} subject${d.instancesFound===1?'':'s'} kept</div>
      <div class="mono" style="font-size:12px;margin:4px 0 12px">${esc(d.pixels)} · ${kb(d.bytesOut)} · ${esc(d.format)}</div>`;
    rows=row('Background',esc(d.background))+row('Edge',d.edge==0?'unshifted':(d.edge<0?'contracted '+(-d.edge)+'px':'expanded '+d.edge+'px'))
      +row('Feather',d.feather+'px');
    foot=`<b>If you see a bright halo</b>, contract the edge by 1–2px and feather by 1. Transparency is saved as PNG, which is large — flatten onto a colour when the background does not need to stay clear.`;
  }
  o.innerHTML=`<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
    <img src="${j.image}" style="max-width:260px;border-radius:8px;border:1px solid var(--line)">

      <a class="btn sm" download="${esc(d.output)}" href="${j.image}" style="margin-top:10px;display:inline-block">⬇ Save ${esc(d.output)}</a>
    </div></div><div style="margin-top:14px;font-size:12.5px">${foot}</div>`;
  $('#rS').textContent='done'+(d.quality?(' · quality '+d.quality):'');
}

/* Bump when new machines are worth seeding. Existing rosters are MERGED, never
   replaced, and only once per seed — so anything you edited or deleted here
   stays edited or deleted. */
const NODE_SEED='2026-07-31-tailnet';
function getNodes(){
  let list=LS.get('nodes',null);
  if(!Array.isArray(list)){ list=DEFAULT_NODES(); LS.set('nodes',list); LS.set('nodesSeed',NODE_SEED); return list; }
  if(LS.get('nodesSeed','')!==NODE_SEED){
    const have=new Set(list.map(n=>n.id));
    DEFAULT_NODES().forEach(d=>{ if(!have.has(d.id)) list.push(d); });
    LS.set('nodes',list); LS.set('nodesSeed',NODE_SEED);
  }

}

async function pingNode(node){
  if(node.kind==='host') return {up:true,note:'this device'};
  const url=(node.url||'').trim(); if(!url) return {up:null,note:'no URL — add one'};
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),4500);
  try{
    const base=url.replace(/\/$/,'');
    if(node.kind==='dgx'){ const r=await fetch(base+'/models',{headers:{'Authorization':'Bearer '+CFG.dgxToken},signal:ctl.signal}); clearTimeout(t);
      if(r.ok){ const j=await r.json(); return {up:true,models:(j.data||[]).map(m=>m.id)}; } return {up:false,note:'HTTP '+r.status}; }
    if(node.kind==='vllm'){ try{ const r=await fetch(base+'/v1/models',{signal:ctl.signal}); clearTimeout(t); if(r.ok){const j=await r.json(); return {up:true,models:(j.data||[]).map(m=>m.id)};} }catch(e){} }
    if(node.kind==='ollama'){ try{ const r=await fetch(base+'/api/tags',{signal:ctl.signal}); clearTimeout(t); if(r.ok){const j=await r.json(); return {up:true,models:(j.models||[]).map(m=>m.name)};} }catch(e){} }
    if(node.kind==='comms'){ const r=await fetch(base+'/health',{headers:{'X-M-Token':CM.cfg().token},signal:ctl.signal}); clearTimeout(t);
      if(r.status===401) return {up:false,note:'bad token'};
      if(r.ok){ const j=await r.json(); return {up:true,note:(j.peers||[]).length+' peer(s) connected'}; } return {up:false,note:'HTTP '+r.status}; }
    await fetch(url,{mode:'no-cors',signal:ctl.signal}); clearTimeout(t); return {up:true,note:'reachable'};
  }catch(e){ clearTimeout(t); return {up:false,note:e.name==='AbortError'?'timeout':'unreachable'}; }
}

/* Where the checking happened last time: 'server' (sockets, sees everything)
   or 'browser' (fetch only, blind to most of the fleet). Shown in the UI so a
   half-empty board is never mistaken for machines being down. */
let FLEET_VIA='';
/* Ask mapai-server to run the checks. A browser can only see hosts that speak
   HTTP *and* send CORS headers, which is almost none of this fleet — the DGX
   publishes its containers on 127.0.0.1 and answers the tailnet on ssh alone,
   the NAS sends no CORS, and a phone serves nothing at all. The server has
   sockets and Tailscale, so it can see all of them. */
async function probeViaServer(nodes){
  try{
    const payload=nodes.map(n=>({id:n.id,kind:n.kind,url:n.url||'',ts:n.ts||'',lan:n.lan||'',ports:n.ports||[],
      token:n.kind==='dgx'?(CFG.dgxToken||''):n.kind==='comms'?(CM.cfg().token||''):''}));
    const r=await fetch('/api/fleet/probe',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({nodes:payload})});
    if(!r.ok) return false;
    const j=await r.json(); if(!j||!j.ok||!j.status) return false;
    Object.keys(j.status).forEach(id=>{ FLEET_STATUS[id]=j.status[id]; });
    return true;
  }catch(e){ return false; }
}
async function pingAll(){
  const nodes=getNodes(); nodes.forEach(n=>{ if(!FLEET_STATUS[n.id]) FLEET_STATUS[n.id]=null; });
  renderFleetRows();
  if(await probeViaServer(nodes)){ FLEET_VIA='server'; }
  else{ FLEET_VIA='browser';
    await Promise.all(nodes.map(async n=>{ FLEET_STATUS[n.id]=await pingNode(n); renderFleetRows(); paintFleetTiles(); })); }
  renderFleetRows(); paintFleetTiles(); loadTailnet();
}
function paintFleetTiles(){

    ${tile('Models available',models,'across the fleet')}
    ${tile('On the tailnet',mesh?mesh.filter(d=>d.online).length+' / '+mesh.length:'—','devices on the mesh')}
    ${tile('This Mac',eng?(eng.up?'online':'offline'):'…','built-in AI',eng&&eng.up?'var(--good)':eng&&eng.up===false?'var(--crit)':'')}
    ${FLEET_VIA==='browser'?tile('Checked by','browser','server checks unavailable','var(--warn)'):''}`;
}

/* ============================================================
   COMMS — private peer chat + file transfer (protocol m-comms/1).
   SSE down (/events), POST up (/send, /file), against a small
   stdlib relay (comms.py) reached over Tailscale. Nothing leaves
   the tailnet and no third party holds message contents.
   The relay is deliberately dumb: it fans every event out to all
   connected peers and keeps the last 200, so a machine that was
   asleep backfills with ?since=<highest id seen>.
   ============================================================ */
const CM={ es:null, state:'off', peers:[], retry:0, timer:null,
  cfg(){ return {relay:String(LS.get('comms.relay','')||'').replace(/\/$/,''), peer:LS.get('comms.peer',''), token:LS.get('comms.token','')}; },
  setCfg(c){ LS.set('comms.relay',c.relay); LS.set('comms.peer',c.peer); LS.set('comms.token',c.token); },
  log(){ return LS.get('comms.log',[]); },
  seen(){ return LS.get('comms.seen',0); } };
const PEER_RE=/^[a-z0-9-]{1,32}$/;

function commsConnect(){
  const c=CM.cfg();
  if(!c.relay||!PEER_RE.test(c.peer)){ toast('Set a relay URL and a peer name first'); commsSetup(); return; }
  commsDisconnect(true); CM.state='connecting'; paintCommsStatus();
  const u=c.relay+'/events?peer='+encodeURIComponent(c.peer)+'&since='+CM.seen()+(c.token?'&token='+encodeURIComponent(c.token):'');
  const es=new EventSource(u); CM.es=es;
  es.onopen=()=>{ if(CM.es!==es)return; CM.state='on'; CM.retry=0; paintCommsStatus(); };
  es.onmessage=e=>{ let ev; try{ ev=JSON.parse(e.data); }catch(_){ return; } commsIngest(ev); };
  /* EventSource retries on its own, but we close and reopen so ?since= is
     current — otherwise a reconnect after sleep replays nothing. */
  es.onerror=()=>{ if(CM.es!==es) return; es.close(); CM.es=null;
    CM.state='retry'; CM.peers=[]; paintCommsStatus(); paintCommsPeers();
    CM.retry=Math.min(CM.retry+1,6); CM.timer=setTimeout(commsConnect,1000*Math.pow(2,CM.retry-1)); };
}
function commsDisconnect(quiet){
  clearTimeout(CM.timer); CM.timer=null;
  if(CM.es){ CM.es.close(); CM.es=null; }
  CM.state='off'; CM.peers=[]; CM.retry=0;
  if(!quiet){ paintCommsStatus(); paintCommsPeers(); }
}
function commsIngest(ev){
  if(ev.t==='presence'){ CM.peers=ev.peers||[]; paintCommsPeers(); paintCommsStatus(); return; }
  if(ev.t!=='msg'&&ev.t!=='file') return;
  const log=CM.log();
  if(log.some(x=>x.id===ev.id)) return;                 /* the relay echoes to the sender too */
  log.push(ev); log.sort((a,b)=>a.id-b.id);
  LS.set('comms.log',log.slice(-200));
  LS.set('comms.seen',Math.max(CM.seen(),ev.id));
  paintCommsLog();
  if(CTX.view!=='comms'&&ev.from!==CM.cfg().peer)
    toast('💬 '+ev.from+' · '+(ev.t==='file'?'sent '+ev.name:String(ev.text).slice(0,60)));
}
async function commsSend(text){
  const c=CM.cfg(); if(!text.trim()) return false;
  try{
    const r=await fetch(c.relay+'/send',{method:'POST',headers:{'Content-Type':'application/json','X-M-Token':c.token},body:JSON.stringify({peer:c.peer,text})});
    if(!r.ok){ toast(r.status===401?'Rejected — token mismatch':'Send failed · HTTP '+r.status); return false; }
    return true;
  }catch(e){ toast('Relay unreachable'); return false; }
}
async function commsSendFile(f){
  const c=CM.cfg();
  if(f.size>100*1024*1024){ toast('Too large — 100 MB max'); return; }
  toast('Sending '+f.name+'…');
  try{
    /* filename goes through encodeURIComponent: header values must be
       latin-1, and the relay unquotes it back. */
    const r=await fetch(c.relay+'/file',{method:'POST',headers:{'X-M-Token':c.token,'X-Peer':c.peer,'X-File-Name':encodeURIComponent(f.name)},body:f});
    toast(r.ok?'Sent '+f.name:'Upload failed · HTTP '+r.status);
  }catch(e){ toast('Relay unreachable'); }
}
async function commsGet(fid,name){
  const c=CM.cfg();
  try{
    const r=await fetch(c.relay+'/file/'+encodeURIComponent(fid),{headers:{'X-M-Token':c.token}});
    if(!r.ok){ toast('Download failed · HTTP '+r.status); return; }
    const u=URL.createObjectURL(await r.blob());
    const a=el('a'); a.href=u; a.download=name||fid; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),5000);
  }catch(e){ toast('Relay unreachable'); }
}
const fmtBytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';

/* ============================================================
   HOME SECURITY (§8.8) — cameras, HomeBase, clip archive

   Scanned 2026-07-31. Every one of the 10,000 TCP ports on both Aosu devices
   was checked from this Mac: exactly one, 6668, answers on each. That is the
   Tuya LAN *control* channel — pairing, motion flags, settings. There is no
   RTSP (554/8554), no ONVIF (8000/2020), no HTTP, no SMB. So the H1L's 32 GB
   of clips are real and local, but nothing on this network can read them, and
   Surveillance Station has nothing to point at. That verdict is stated in the
   UI rather than hidden, because the alternative is a camera page that looks
   broken for a reason nobody can see.
   ============================================================ */
/* Identity below is not guesswork. Both cameras broadcast a Tuya discovery
   frame on udp/6667; decrypting it with the well-known Tuya UDP key (AES-128-ECB,
   md5 of "yGAdlopoPVldABfn", skipping the 4-byte return code) yields their real
   device ids and a shared productKey — which is how we know these two are the
   same model, and that neither of them is the H1L base. */
function DEFAULT_CAMS(){ return []; }
const CAM_SEED='2026-07-31-aosu-b';
function getCams(){
  let list=LS.get('cams',null);
  if(!Array.isArray(list)){ list=DEFAULT_CAMS(); LS.set('cams',list); LS.set('camsSeed',CAM_SEED); return list; }
  if(LS.get('camsSeed','')!==CAM_SEED){
    const have=new Set(list.map(c=>c.id));
    DEFAULT_CAMS().forEach(c=>{ if(!have.has(c.id)) list.push(c); });
    LS.set('cams',list); LS.set('camsSeed',CAM_SEED);
  }
  return list;
}
function saveCams(l){ LS.set('cams',l); }
let CAM_STATUS={};
/* go2rtc, once it exists, is the only piece that can put a live picture on this
   page: it speaks WebRTC to the browser, which <img>/<video> against an RTSP

function go2rtcBase(){ return (LS.get('go2rtc','')||'').replace(/\/+$/,''); }

      <span class="chip">go2rtc · not deployed</span>
    </div>`;
  w.appendChild(nas);

  w.appendChild(el('div','note','<b>Why status can look blank.</b> These cameras never join the tailnet — they exist only at <span class="mono">192.168.x.x</span>. LifeOS must be served from localhost by mapai-server for the check to use a real socket; opened straight off disk there is no server, and every row goes quiet. That is the checker being blind, not the cameras being off.'));

  const eh=el('div'); eh.id='camEdit'; eh.style.marginTop='16px'; w.appendChild(eh);

      <label class="fld"><span>Notes</span><input id="cN" value="${c?esc(c.notes||''):''}"></label>
    </div></div>`;

  const del=$('#cDel');
  if(del) del.onclick=()=>{ saveCams(getCams().filter(x=>x.id!==c.id)); delete CAM_STATUS[c.id];
    eh.innerHTML=''; renderCamRows(); paintCamTiles(); paintCamLive(); toast('Device removed'); };
  $('#cSave').onclick=()=>{
    const rec={ id:c?c.id:'cam'+Date.now().toString(36),
      label:$('#cL').value.trim()||'Untitled device', role:$('#cR').value.trim(),
      lan:$('#cA').value.trim(), power:$('#cP').value.trim(),

      stream:$('#cS').value.trim(), notes:$('#cN').value.trim(), mac:c?c.mac:'' };
    const l=getCams(); const i=l.findIndex(x=>x.id===rec.id);
    if(i>=0) l[i]=rec; else l.push(rec);
    saveCams(l); eh.innerHTML=''; delete CAM_STATUS[rec.id];
    renderCamRows(); paintCamTiles(); paintCamLive(); toast('Saved'); pingCams(); };
}

   becomes the feedback + selections pen. Feedback persists to
   the CORE record immediately and to vault/reviews/reviews.json
   on disk via POST /api/reviews/feedback (disk wins on reload).
   ============================================================ */
const DOCBASE=location.pathname.replace(/\/[^/]*$/,'');   /* '' at :8765 · '/lifeos' behind :3001 */
/* vault files need the /lifeos prefix behind :3001; /api/* is proxied at both
   origins as-is, so rendered-markdown docs must NOT be prefixed */
const docSrc=u=>u.startsWith('/api/')?u:DOCBASE+u;
let DOCV={id:null,from:'reviews'};
function openDoc(rec,from){ if(!rec||!rec.doc_url) return;
  DOCV.id=rec.taxonomy_id; DOCV.from=from||(CTX.view!=='doc'?CTX.view:DOCV.from)||'reviews';
  CTX.view='doc'; renderRail(); render(); }
function renderDoc(){
  const r=CORE.records[DOCV.id]; if(!r||!r.doc_url){ CTX.view='reviews'; return render(); }
  if(!window._cwTitle0){ const ct=$('#cwTitle'); window._cwTitle0=ct?ct.textContent:"My Map"; }

  v.innerHTML=`<iframe class="docframe" src="${esc(docSrc(r.doc_url))}" title="${esc(r.doc_title||r.label)}"></iframe>`;
  const ct=$('#cwTitle'); if(ct) ct.textContent=r.label||r.doc_title||'Document';
  docRail(r);
}
function docRail(r){
  const rail=$('#rail'); if(!rail) return; MM.railHijacked=true;
  const sibs=all().filter(x=>x.doc_url===r.doc_url&&x.taxonomy_id!==r.taxonomy_id);
  const sug=Array.isArray(r.doc_suggestions)?r.doc_suggestions:[];
  rail.innerHTML='<div class="prail">'
    +'<button class="btn ghost sm" id="fbBack" style="width:100%">← Back to '+esc(DOCV.from==='reviews'?'Reviews':DOCV.from)+'</button>'

    +'<div style="margin-top:7px"><span class="badge '+statusClass(r.status)+'">'+esc(r.status)+'</span> <span class="badge '+priClass(r.priority)+'">'+esc(r.priority)+'</span></div></div>'
    +'<div class="grp">Suggestions — select text in the document, then quote it</div>'
    +'<button class="btn ghost sm" id="fbQuote" style="width:100%">❝ Quote the selection</button>'
    +sug.map((s,i)=>'<div class="pcard" style="font-size:12px;margin-top:6px;position:relative">'
      +'<button class="iconbtn" data-unsug="'+i+'" style="position:absolute;top:4px;right:4px" title="Remove">✕</button>'
      +'<div style="font-style:italic;color:var(--ink-4);padding-right:20px">❝'+esc(s.quote.length>180?s.quote.slice(0,180)+'…':s.quote)+'❞</div>'
      +'<input data-sugnote="'+i+'" value="'+esc(s.note||'')+'" placeholder="change to / because…" style="width:100%;margin-top:5px;font-size:12px;background:transparent;border:0;border-bottom:1px solid var(--ink-4);color:inherit;outline:none">'
      +'</div>').join('')
    +'<div class="grp">Feedback</div>'
    +'<textarea class="fbta" id="fbText" placeholder="What&#39;s right, what&#39;s wrong, what changes…">'+esc(r.doc_feedback||'')+'</textarea>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px">'
    +'<select class="fbsel" id="fbStatus">'+['Active','Completed'].map(s=>'<option '+(r.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select>'
    +'<select class="fbsel" id="fbPri">'+['P1','P2','P3'].map(p=>'<option '+(r.priority===p?'selected':'')+'>'+p+'</option>').join('')+'</select></div>'
    +'<button class="btn ghost sm" id="fbSave" style="width:100%;margin-top:8px">💾 Save (stays here)</button>'
    +'<button class="btn sm" id="fbSubmit" style="width:100%;margin-top:7px">📮 Submit to Claude — begin prompts</button>'
    +(r.doc_submitted_at?'<div class="mono" style="font-size:10.5px;color:var(--ink-4);margin-top:5px;text-align:center">last submitted '+esc(String(r.doc_submitted_at).slice(0,16).replace('T',' '))+'</div>':'')
    +'<div class="grp">Record</div>'
    +'<div style="display:grid;gap:7px">'
    +'<button class="btn ghost sm" id="fbEdit">✎ Edit the record</button>'
    +'<button class="btn ghost sm" id="fbTab">⧉ Open in its own tab</button></div>'
    +(sibs.length?'<div class="grp">Also in this document</div>'+sibs.map(s=>'<div class="pcard" data-sib="'+esc(s.taxonomy_id)+'" style="cursor:pointer;font-size:12px;margin-bottom:6px"><span class="badge '+statusClass(s.status)+'" style="margin-right:6px">'+esc(s.status)+'</span>'+esc(s.label)+'</div>').join(''):'')
    +'</div>';
  /* keep unsaved typing across re-renders */
  const pull=()=>{ const rec=CORE.records[r.taxonomy_id]; if(!rec) return null;
    rec.doc_feedback=$('#fbText').value; rec.status=$('#fbStatus').value; rec.priority=$('#fbPri').value;
    rail.querySelectorAll('[data-sugnote]').forEach(n=>{ const s=(rec.doc_suggestions||[])[+n.dataset.sugnote]; if(s) s.note=n.value; });
    return rec; };
  $('#fbBack').onclick=()=>{ CTX.view=DOCV.from==='doc'?'reviews':DOCV.from; renderRail(); render(); };
  $('#fbEdit').onclick=()=>openRecord(r.taxonomy_id);
  $('#fbTab').onclick=()=>window.open(docSrc(r.doc_url),'_blank');
  /* the document iframe is same-origin (it's our own vault) — read its selection */
  $('#fbQuote').onclick=()=>{ const f=$('.docframe'); let q='';
    try{ q=String(f&&f.contentWindow?f.contentWindow.getSelection():'').trim(); }catch(e){}
    if(!q){ toast('Select some text in the document first'); return; }

  rail.querySelectorAll('[data-unsug]').forEach(b=>b.onclick=()=>{ const rec=pull(); if(!rec) return;

  $('#fbSave').onclick=async()=>{
    const rec=pull(); if(!rec) return; rec.updated_at=nowISO(); saveCore();
    let disk=false;
    if(rec.source==='reviews-feed'){
      try{ const res=await(await fetch('/api/reviews/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:rec.taxonomy_id.replace(/^review-/,''),status:rec.status==='Completed'?'done':'open',priority:rec.priority,feedback:rec.doc_feedback})})).json();
        disk=!!res.ok; }catch(e){}
    }
    toast(disk?'Saved — core + reviews.json on disk':'Saved to the core'+(rec.source==='reviews-feed'?' (disk copy syncs when the server relaunches)':''));
    docRail(rec);
  };
  /* 📮 the whole pen — prose, quotes, status — lands as one card in
     ~/LifeOS/inbox/ where the next Claude session picks it up and begins
     the prompts. Nothing sends off this machine. */
  $('#fbSubmit').onclick=async()=>{
    const rec=pull(); if(!rec) return; rec.updated_at=nowISO(); saveCore();
    if(!(rec.doc_feedback||'').trim()&&!(rec.doc_suggestions||[]).length){ toast('Write feedback or quote a selection first'); return; }
    try{
      const res=await(await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:rec.taxonomy_id,label:rec.label,doc_url:rec.doc_url,doc_title:rec.doc_title||'',
          status:rec.status,priority:rec.priority,feedback:rec.doc_feedback||'',suggestions:rec.doc_suggestions||[]})})).json();
      if(res.ok){ rec.doc_submitted_at=nowISO(); saveCore(); toast('Submitted → '+(res.path||'~/LifeOS/inbox')); docRail(rec); }
      else toast('Submit failed: '+(res.error||'server said no'));
    }catch(e){ toast('Submit needs the local server — run: mapai up'); }
  };
  rail.querySelectorAll('[data-sib]').forEach(n=>n.onclick=()=>{ DOCV.id=n.dataset.sib; render(); });
}

/* ============================================================
   VAULT · KEYS — AES-GCM secret store + rotation clock
   ------------------------------------------------------------
   Two stores by design, because one cannot do both jobs:
     · this vault  — passphrase-gated, for YOUR eyes. Key never stored.
     · macOS Keychain via ~/Desktop/MapAi/mapsec — for MACHINES
       (local LLMs, cron, scripts) that must read without a human.
   MANIFEST below holds NO secret material — only where each key lives,
   how to retrieve it, and when it is due. Safe for any local model to read.
   ============================================================ */
let SECRETS=[
  /* Placeholder register. Replace with your real credential MANIFEST — it
     holds NO secret values, only where each key lives, how to retrieve it,
     and when rotation is due. */
  {k:'EXAMPLE_API_KEY',tier:2,store:'your host\'s env settings',uses:'example entry — replace me',cadence:90,last:null,

/* ==== chat-action-harness ====
   Small local models cannot edit this file — and should not. The app exposes
   LEVERS: named actions any chat model (rung 1-4) can invoke by replying with
   one JSON object. The model only chooses; validated code executes. A
   deterministic intent net sits under the model so unambiguous asks land even
   when a small model rambles. Custom vault entries live in LS 'vault.custom'
   and merge over the manifest (embedded or secrets-manifest.json). */
const customSecrets=()=>LS.get('vault.custom',[]);

  ANTHROPIC_API_KEY:{tier:2,store:'Local shell env',uses:'Direct Anthropic API calls (the m-bridge subscription path normally covers this)',get:'console.anthropic.com → API keys',set:'export ANTHROPIC_API_KEY=…',note:''},
  GEMINI_API_KEY:{tier:2,store:'LifeOS Settings + local shell env',uses:'LifeOS chat — Gemini frontier models',get:'aistudio.google.com → Get API key',set:'LifeOS → Settings → Gemini key',note:''},
  ELEVENLABS_API_KEY:{tier:2,store:'Local .env — build-time only',uses:'FAQ voice render / VoiceAssistant pipeline',get:'ElevenLabs → Profile → API Keys',set:'Add to local .env; never read at runtime',note:''}

    desc:'Add a key/credential entry to the Vault · Keys manifest. args: {"k":"ENV_STYLE_NAME","tier":1|2|"local","store":"where the value lives","uses":"what consumes it","get":"how to obtain","set":"how to install","note":""} — only k is required.',
    run(a){

/* ---------- crypto: PBKDF2-SHA256 → AES-256-GCM, key in memory only ---------- */
const VITER=600000, VIDLE=5*60*1000;
let VK=null, VKat=0;
const vStore=()=>LS.get('vault',null);
const vSave=v=>LS.set('vault',v);
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function vLock(){ VK=null; VKat=0; }
function vLocked(){ if(VK&&Date.now()-VKat>VIDLE) vLock(); return !VK; }
function vTouch(){ if(VK) VKat=Date.now(); }
async function vDerive(pass,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:VITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function vEnc(plain){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},VK,new TextEncoder().encode(plain));
  return {iv:b64(iv),ct:b64(ct)};
}
async function vDec(rec){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(rec.iv)},VK,ub64(rec.ct));
  return new TextDecoder().decode(pt);
}
async function vCreate(pass){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  VK=await vDerive(pass,salt); VKat=Date.now();
  const check=await vEnc('mos.vault.ok');
  vSave({v:1,salt:b64(salt),iter:VITER,check,items:{}}); return true;
}
async function vUnlock(pass){
  const s=vStore(); if(!s) return vCreate(pass);
  VK=await vDerive(pass,ub64(s.salt)); VKat=Date.now();
  try{ if(await vDec(s.check)!=='mos.vault.ok') throw 0; return true; }
  catch(e){ vLock(); return false; }
}
async function vPut(key,val){
  const s=vStore()||{v:1,items:{}}; s.items=s.items||{};
  const prev=s.items[key]||{};
  s.items[key]=Object.assign({},prev,await vEnc(val),{rot:new Date().toISOString().slice(0,10)});
  vSave(s);
}
function vDel(key){ const s=vStore(); if(s&&s.items){ delete s.items[key]; vSave(s); } }
function vHas(key){ const s=vStore(); return !!(s&&s.items&&s.items[key]); }
function vRot(key){ const s=vStore(); return s&&s.items&&s.items[key]?s.items[key].rot:null; }
/* ---------- rotation clock ---------- */
function rotState(s){
  const last=vRot(s.k)||s.last;
  if(!s.cadence) return {cls:'',txt:'on-demand',days:null,last};
  if(!last) return {cls:'down',txt:'never rotated',days:-9999,last};
  const due=new Date(last+'T00:00:00'); due.setDate(due.getDate()+s.cadence);
  const days=Math.ceil((due-new Date())/86400000);
  if(days<0) return {cls:'down',txt:'overdue '+(-days)+'d',days,last};
  if(days<=14) return {cls:'wait',txt:'due in '+days+'d',days,last};
  return {cls:'up',txt:'in '+days+'d',days,last};
}

      <label class="fld" style="display:flex;align-items:flex-start;gap:10px"><input type="checkbox" id="s_ccRoute" style="width:auto;margin-top:3px" ${CFG.ccRoute?'checked':''}><span style="margin:0">Route Claude through the local Claude Code bridge — uses your Max subscription, <b>no API key</b>. Opus/Fable/Sonnet then work with the bridge running.</span></label>
      <label class="fld"><span>Bridge URL</span><input id="s_ccBridge" value="${esc(CFG.ccBridge)}" placeholder="http://localhost:8787"><small>Start it: <span class="mono">python3 ~/Desktop/MapAi/m-bridge.py</span></small></label>
      <div class="note mono" style="font-size:11px;margin-bottom:12px">With the bridge on, the Anthropic key below is ignored for Claude. Gemini still needs its own key. Bridge calls draw on your subscription's 5-hour limits.</div>
      <label class="fld"><span>Anthropic API key (optional — only if bridge off)</span><input id="s_anthropic" type="password" value="${esc(CFG.anthropic)}" placeholder="sk-ant-…"></label>
      <label class="fld"><span>Gemini API key</span><input id="s_gemini" type="password" value="${esc(CFG.gemini)}" placeholder="AIza…"></label></div>
    <div class="card" style="padding:18px;margin-bottom:14px"><h4 style="font-size:14px;margin-bottom:4px">🔐 MapAi vault — this Mac</h4>
      <p style="font-size:12px;color:var(--ink-3);margin:0 0 14px">The encrypted folder on your Desktop. Finder asks a human for this password; agents read it from the Keychain, so changing it here updates both together.</p>
      <div id="dvStat" class="note mono" style="font-size:11.5px;margin-bottom:14px">checking…</div>
      <div id="dvBody" style="display:none">
        <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px">
          <div style="flex:0 0 auto;text-align:center">
            <img id="dvIconImg" alt="vault icon" style="width:76px;height:76px;border-radius:14px;display:block;background:var(--ink-6, #eee)">
            <div style="font-size:10.5px;color:var(--ink-4);margin-top:6px">Desktop icon</div>
          </div>
          <div style="flex:1;min-width:240px">
            <label class="fld"><span>Replace the icon</span><input id="dv_icon" type="file" accept="image/png,image/jpeg,image/gif,image/webp,.icns"><small>PNG, JPEG, GIF, WEBP or ICNS. Square works best — anything else is padded, not stretched. Max 8 MB.</small></label>
            <div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn ghost sm" id="dvIconGo">Apply icon</button><button class="btn ghost sm" id="dvIconReset">Restore map.ca logo</button>
              <span class="mono" id="dvIconMsg" style="font-size:11px;color:var(--ink-4);align-self:center"></span></div>
          </div>
        </div>
        <div style="border-top:1px solid var(--line, #e5e1da);padding-top:16px">
          <label class="fld"><span>Current vault password</span><input id="dv_old" type="password" autocomplete="current-password" placeholder="the one you type on double-click"></label>
          <div class="fgrid"><label class="fld"><span>New password</span><input id="dv_new" type="password" autocomplete="new-password"></label>
            <label class="fld"><span>Confirm new password</span><input id="dv_new2" type="password" autocomplete="new-password"></label></div>
          <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><button class="btn" id="dvPwGo">Change vault password</button>
            <span class="mono" id="dvPwMsg" style="font-size:11px;color:var(--ink-4)"></span></div>
          <p style="font-size:11.5px;color:var(--ink-4);margin:12px 0 0">Verified against the disk image itself, not the Keychain copy — a wrong or stale Keychain entry can never be used to take the vault over. The new value is written to the Keychain only after the change succeeds.</p>
        </div>
      </div></div>
    <div class="card" style="padding:18px"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="sSave">Save</button><button class="btn ghost sm red" id="sWipe">Wipe ALL local data</button></div>
      <p style="font-size:12px;color:var(--ink-4);margin:12px 0 0">If calls fail with a network/CORS error, serve this file locally (<span class="mono">python3 -m http.server</span>) instead of double-clicking — some endpoints reject the file:// origin.</p></div>`;
  w.appendChild(c);
  $('#sSave').onclick=()=>{ ['dgxBase','dgxToken','dgxModel','dgxModel2','dgxVision','dgxEmbed','anthropic','gemini'].forEach(k=>CFG[k]=$('#s_'+k).value.trim()||DEF[k]); CFG.dgxToken=$('#s_dgxToken').value.trim(); CFG.anthropic=$('#s_anthropic').value.trim(); CFG.gemini=$('#s_gemini').value.trim(); CFG.ccRoute=$('#s_ccRoute').checked; CFG.ccBridge=$('#s_ccBridge').value.trim()||DEF.ccBridge; saveCfg(); toast('Settings saved'); quietPing(); };
  $('#sWipe').onclick=()=>{ if(confirm('Wipe EVERYTHING — keys, records, handoff score?')){ Object.keys(localStorage).filter(k=>k.startsWith('mos.')).forEach(k=>localStorage.removeItem(k)); location.reload(); } };
  wireVaultPanel();
}

/* ---------- MapAi vault panel -------------------------------------------
   Talks to mapai-server.py on the same origin. A browser cannot run hdiutil
   or write a resource fork, so the server does that work; this only collects
   input and reports what came back. Served from file:// there is no server,
   so the panel says so plainly rather than failing with a console error. */
function vaultApi(path,body){
  const opt=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};
  return fetch(path,opt).then(r=>r.json().catch(()=>({ok:false,error:'server sent no JSON'})));
}
async function wireVaultPanel(){
  const stat=$('#dvStat'); if(!stat) return;
  if(location.protocol==='file:'){
    stat.innerHTML='Not available over <b>file://</b> — the vault controls need the local server. '+
      'Open LifeOS by unlocking MapAi, or run <span class="mono">~/LifeOS/bin/mapai-front</span>.';
    return;
  }
  let s;
  try{ s=await vaultApi('/api/vault/status'); }
  catch(e){ stat.textContent='Local server not reachable — start it with: ~/LifeOS/bin/mapai-front'; return; }
  if(!s||!s.ok){ stat.textContent='Vault status unavailable.'; return; }

  const mb=(s.bytes_on_disk/1e6).toFixed(1);
  const weak=s.password_len&&s.password_len<8;
  stat.innerHTML=`${s.open?'🔓 open at <b>'+esc(s.mount)+'</b>':'🔒 locked'} · ${mb} MB on disk · AES-256`+
    (s.password_in_keychain?` · password is ${s.password_len} characters`:' · <b>no password in the Keychain</b> — agents cannot open it')+
    (weak?'<br><b style="color:var(--red,#c0392b)">A password this short falls to a brute force in seconds if anyone copies the bundle. The encryption is strong; the password is the weak link.</b>':'')+
    (s.nas?`<br>NAS: ${esc(s.nas)} · agent: ${esc(s.agent||'—')}`:'');
  $('#dvBody').style.display='';
  if(s.icon) $('#dvIconImg').src=s.icon;

  // ---- icon
  const iconMsg=$('#dvIconMsg');
  $('#dvIconGo').onclick=()=>{
    const f=$('#dv_icon').files&&$('#dv_icon').files[0];
    if(!f){ iconMsg.textContent='choose an image first'; return; }
    if(f.size>8*1024*1024){ iconMsg.textContent='over 8 MB'; return; }
    iconMsg.textContent='applying…';
    const rd=new FileReader();
    rd.onload=async()=>{
      const r=await vaultApi('/api/vault/icon',{image_base64:rd.result});
      if(r.ok){ iconMsg.textContent='done — Finder may need a moment'; toast('Vault icon updated'); wireVaultPanel(); }
      else iconMsg.textContent=r.error||'failed';
    };
    rd.readAsDataURL(f);
  };
  $('#dvIconReset').onclick=async()=>{
    iconMsg.textContent='restoring…';
    const r=await vaultApi('/api/vault/icon/reset',{});
    if(r.ok){ iconMsg.textContent='map.ca logo restored'; toast('Icon reset'); wireVaultPanel(); }
    else iconMsg.textContent=r.error||'failed';
  };

  // ---- password
  const pwMsg=$('#dvPwMsg');
  $('#dvPwGo').onclick=async()=>{
    const oldp=$('#dv_old').value, np=$('#dv_new').value, np2=$('#dv_new2').value;
    if(!oldp||!np){ pwMsg.textContent='fill in the current and new password'; return; }
    if(np!==np2){ pwMsg.textContent='the two new passwords do not match'; return; }
    if(np.length<8&&!confirm('That password is under 8 characters. Anyone who copies the vault can brute-force it in seconds.\n\nSet it anyway?')) return;
    pwMsg.textContent='re-encrypting…';
    const r=await vaultApi('/api/vault/password',{current:oldp,new:np});
    if(r.ok){
      $('#dv_old').value=$('#dv_new').value=$('#dv_new2').value='';
      pwMsg.textContent='changed · '+r.strength;
      toast('Vault password changed');
      wireVaultPanel();
    } else if(r.critical){
      pwMsg.textContent='SEE THE ALERT';
      alert(r.error);
    } else pwMsg.textContent=r.error||'failed';
  };
}
async function quietPing(){ try{ const r=await fetch(CFG.dgxBase.replace(/\/$/,'')+'/models',{headers:{'Authorization':'Bearer '+CFG.dgxToken}}); setPill(r.ok); }catch(e){ setPill(false); } }

/* ============================================================ BOOT */
renderRail(); render(); quietPing(); shellInit();
/* secrets-manifest.json is the shared source of truth with ./mapsec — prefer it
   over the copy embedded above so the CLI and this view cannot drift. Silently
   keeps the embedded copy when the file is absent or we're on file:// . */
(async()=>{ try{ const r=await fetch('./secrets-manifest.json',{cache:'no-store'}); if(!r.ok) return;
  const j=await r.json(); if(Array.isArray(j.secrets)&&j.secrets.length){ SECRETS=j.secrets; if(CTX.view==='vault') render(); }
}catch(e){/* embedded copy stands */} })();
/* prompt library (disk → CORE, read-only mirror). The markdown cards in
   ~/LifeOS/vault/projects/prompt-library/ are the source of truth; stable
   taxonomy_ids make this upsert idempotent, so cards appear once in Projects
   and track their on-disk status on every load. Launch builds from the
   terminal: ~/LifeOS/bin/prompts launch <n>. Full two-way bridge = card 01. */
(async()=>{ try{
  const r=await fetch('/api/prompts',{cache:'no-store'}); if(!r.ok) return;
  const j=await r.json(); if(!j.ok||!Array.isArray(j.cards)||!j.cards.length) return;
  const SMAP={todo:'Pending',building:'Active',done:'Completed',repeatable:'Active'};
  const LIBNAME={'prompt-library':'LifeOS prompt library','aiharness-library':'aiharness.ca library',
    'brucetrail-library':'Bruce Trail library','groundtruth-library':'Ground Truth library',
    'maplaunch-library':'The Map — launch library'};
  let changed=false;
  const put=(id,p)=>{ const prev=CORE.records[id]||newRecord({taxonomy_id:id});
    const next=Object.assign({},prev,p,{taxonomy_id:id});
    if(JSON.stringify(prev)!==JSON.stringify(next)){ next.updated_at=nowISO(); CORE.records[id]=next; changed=true; } };
  /* one Project record per library on disk; the legacy prompt-library keeps its
     original ids so nothing the owner touched moves. A library with an HTML
     deliverable carries doc_url → clicking it fills the body window. */
  const libs=Array.isArray(j.libs)&&j.libs.length?j.libs:[{name:'prompt-library',doc_url:'',doc_title:''}];
  libs.forEach(L=>{ const pid=L.name==='prompt-library'?'prompt-library':'prompt-lib-'+L.name;
    put(pid,{object_type:'Project',workspace_id:'personal',label:LIBNAME[L.name]||L.name,
      status:'Active',priority:'P1',source:'prompt-library',confidentiality:'Personal',verification_status:'Verified',
      doc_url:L.doc_url||'', doc_title:L.doc_title||'',
      description:'Launchable build cards. Terminal: PROMPTS_LIB=~/LifeOS/vault/projects/'+L.name+' ~/LifeOS/bin/prompts (list) · … launch <n> (build). Files: ~/LifeOS/vault/projects/'+L.name+'/'}); });
  j.cards.forEach(c=>{ const lib=c.lib||'prompt-library';
    const pid=lib==='prompt-library'?'prompt-library':'prompt-lib-'+lib;
    const cid=lib==='prompt-library'?'prompt-card-'+c.id:'prompt-card-'+lib+'-'+c.id;
    put(cid,{object_type:'Task',parent_id:pid,workspace_id:'personal',
      label:'Card '+c.id+' · '+c.title, status:SMAP[c.status]||'Pending',
      priority:/^P[0-5]$/.test(c.priority)?c.priority:'P3', source:'prompt-library',confidentiality:'Personal',
      doc_url:c.doc||'', doc_title:c.title,
      description:'['+c.area+'] Launch: PROMPTS_LIB=~/LifeOS/vault/projects/'+lib+' ~/LifeOS/bin/prompts launch '+c.id+' · '+c.path}); });
  if(changed){ saveCore(); renderRail(); if(CTX.view==='projects') render(); toast('Prompt libraries synced from spine'); }
}catch(e){/* server absent or file:// — dashboard stands alone */} })();
/* reviews feed (disk → CORE, read-only mirror). the owner-action items harvested
   from every HTML deliverable in the vault and re-verified against the live
   system live in vault/reviews/reviews.json (served at /api/reviews). Each
   gets a review_date so the Reviews view lists it. Disk wins. */
(async()=>{ try{
  const r=await fetch('/api/reviews',{cache:'no-store'}); if(!r.ok) return;
  const j=await r.json(); if(!j.ok||!Array.isArray(j.items)||!j.items.length) return;
  let changed=false;
  const put=(id,p)=>{ const prev=CORE.records[id]||newRecord({taxonomy_id:id});
    const next=Object.assign({},prev,p,{taxonomy_id:id});
    if(JSON.stringify(prev)!==JSON.stringify(next)){ next.updated_at=nowISO(); CORE.records[id]=next; changed=true; } };
  j.items.forEach(it=>{ put('review-'+it.id,{object_type:'Review',workspace_id:'personal',
    label:it.title, status:it.status==='done'?'Completed':'Active',
    priority:/^P[0-5]$/.test(it.priority)?it.priority:'P2',
    review_date:it.review_date||todayISO(), source:'reviews-feed', confidentiality:'Personal',
    doc_url:it.source_url||'', doc_title:it.source_doc||'',
    description:it.action+' — Source: '+(it.source_doc||'')+' ('+location.origin+(it.source_url||'')+')'+(it.verified?' · Verified: '+it.verified:'')}); });
  if(changed){ saveCore(); renderRail(); if(CTX.view==='reviews') render(); toast('Reviews synced from your deliverables'); }
}catch(e){/* offline — CORE stands */} })();
/* keep the channel open regardless of which view is showing, so messages
   land (as toasts) while you're elsewhere in the app */
if(CM.cfg().relay&&PEER_RE.test(CM.cfg().peer)) commsConnect();
addEventListener('beforeunload',()=>commsDisconnect(true));
</script>
